name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Vet, Test (Race) & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -race ./...

      - name: Build single binary (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/go-sd ./cmd
