{{ define "gallery_panel" }}
<section class="panel gallery-panel">
  <div class="gallery-toolbar">
    <div class="toolbar-left">
      <h2 class="panel-title">Asset Showcase</h2>
      <span id="galleryCount" class="count-badge">0 items</span>
    </div>
    <div class="toolbar-actions">
      <button type="button" id="selectAllBtn" class="btn-subtle">Select All</button>
      <button type="button" id="deselectAllBtn" class="btn-subtle">Deselect</button>
      <button type="button" id="deleteSelectedBtn" class="btn-danger-subtle" disabled title="Delete selected artworks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        <span id="deleteBtnLabel">Delete</span>
      </button>
      <button type="button" id="openExportBtn" class="btn-accent" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span id="exportBtnLabel">Package Selected (0)</span>
      </button>
    </div>
  </div>

  <div id="galleryGrid" class="gallery-grid"></div>

  <!-- Empty State outside grid to preserve DOM element -->
  <div id="emptyGallery" class="empty-state">
    <div class="empty-icon">🎨</div>
    <h3 class="empty-title">Your Studio Canvas is Empty</h3>
    <p class="empty-desc">Enter a prompt on the left and hit <strong>Generate Artwork</strong> to start rendering commercial art sets.</p>
  </div>
</section>
{{ end }}
