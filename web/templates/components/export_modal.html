{{ define "export_modal" }}
<div id="exportModal" class="modal-overlay hidden">
  <div class="modal-container">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <h3 class="modal-title">Package & Export Digital Assets</h3>
        <p class="modal-subtitle">Generate storefront-ready bundles, licenses, mockups, and CSV listings.</p>
      </div>
      <button type="button" id="closeExportModalBtn" class="modal-close-btn">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Platform Selector Tabs -->
      <div class="platform-tabs">
        <button type="button" class="tab-btn active" data-platform="etsy">
          <span class="tab-icon">🛍️</span>
          <span class="tab-name">Etsy Listing</span>
        </button>
        <button type="button" class="tab-btn" data-platform="gumroad">
          <span class="tab-icon">⚡</span>
          <span class="tab-name">Gumroad</span>
        </button>
        <button type="button" class="tab-btn" data-platform="shopify">
          <span class="tab-icon">🏪</span>
          <span class="tab-name">Shopify</span>
        </button>
        <button type="button" class="tab-btn" data-platform="raw">
          <span class="tab-icon">📦</span>
          <span class="tab-name">RAW Archive</span>
        </button>
      </div>

      <form id="exportForm" class="export-form">
        <input type="hidden" id="exportPlatformInput" name="platform" value="etsy">

        <div class="form-group">
          <label for="exportTitleInput">Product / Bundle Title</label>
          <input
            type="text"
            id="exportTitleInput"
            name="title"
            placeholder="e.g. Wax Crayon Armored Dire Wolf Clipart Set"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="exportPriceInput">Listing Price ($ USD)</label>
            <input type="number" id="exportPriceInput" name="price" value="4.99" step="0.50" min="0">
          </div>
          <div class="form-group flex-2">
            <label for="exportTagsInput">Custom Tags (Comma Separated)</label>
            <input type="text" id="exportTagsInput" name="custom_tags" placeholder="dire wolf, fantasy clipart, dnd art">
          </div>
        </div>

        <div class="selected-summary-bar">
          <span id="exportSelectedCount">0 items selected for packaging</span>
        </div>

        <!-- Export Progress / Results Box -->
        <div id="exportResultBox" class="result-box hidden">
          <div class="result-header">
            <span class="result-badge">Bundle Ready</span>
            <span id="resultBundleName" class="result-name"></span>
          </div>
          <div class="result-links">
            <a id="downloadZipLink" class="btn-download" href="#" download>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Download Full-Res ZIP (.zip)
            </a>
            <a id="downloadCoverLink" class="btn-subtle hidden" href="#" target="_blank">View 2000x2000 Cover</a>
            <a id="downloadCsvLink" class="btn-subtle hidden" href="#" download>Download Etsy CSV</a>
          </div>
          <div id="resultTagsWrap" class="result-tags-wrap">
            <label>Generated 13 SEO Tags:</label>
            <div id="resultTagsPills" class="tags-pills"></div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelExportBtn" class="btn-subtle">Cancel</button>
          <button type="submit" id="submitExportBtn" class="btn-primary">
            <span class="btn-spinner hidden" id="exportSpinner"></span>
            <span id="exportSubmitText">🚀 Generate & Package Bundle</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{{ end }}
